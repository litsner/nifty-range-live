<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIFTY Range Live</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="container">
    <header>
      <div>
        <div class="eyebrow">NIFTY 50 • OPTION CHAIN</div>
        <h1>NIFTY Range Live</h1>
        <p>Live support & resistance calculator</p>
      </div>
      <button id="refreshBtn">Refresh</button>
    </header>

    <section id="status" class="status">Connecting…</section>

    <section class="cards">
      <div class="card support"><span>Support</span><strong id="support">—</strong></div>
      <div class="card resistance"><span>Resistance</span><strong id="resistance">—</strong></div>
    </section>

    <section class="panel">
      <div class="row"><span>Highest-volume strike</span><b id="highestStrike">—</b></div>
      <div class="row"><span>Second-highest-volume strike</span><b id="secondStrike">—</b></div>
      <div class="row"><span>Updated</span><b id="updated">—</b></div>
    </section>

    <p class="note">Data is fetched from the server. During market hours, refresh to update the calculation.</p>
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
